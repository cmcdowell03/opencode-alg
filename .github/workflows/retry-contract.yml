name: Retry contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: retry-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic:
    name: Windows synthetic checks
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run typecheck
      - name: Model-agnostic retry, security, and durability regressions
        run: >-
          bun test tests/schema-retry-diagnostics.test.ts tests/sdk-retry-contract.test.ts
          tests/response-reliability.test.ts tests/schemas.test.ts
          tests/runtime-completion.test.ts tests/executor.test.ts
          tests/models-sessions-plugin.test.ts tests/architecture-audit.test.ts
          tests/reliability-observability.test.ts --timeout 60000
      - run: bun run smoke
